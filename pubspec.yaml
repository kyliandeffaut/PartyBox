name: partybox
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  shared_preferences: ^2.5.5
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/action_verite.json
    - assets/je_nai_jamais.json
    - assets/tribunal.json
    - assets/tu_prefere.json
    - assets/images/

# --- CONFIGURATION DU SPLASH SCREEN NATIF ---
flutter_native_splash:
  color: "#000000"
  image: assets/images/logo.png
  android: true
  ios: true